<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
		<title>Frontend Mentor | Order summary card</title>

		<link rel="stylesheet" href="./styles/style.css" />
		<link rel="stylesheet" href="./styles/media-query.css" />
	</head>
	<body>
		<div class="background"></div>

		<main class="order-card">
			<img class="order-card__hero" src="./images/illustration-hero.svg" alt="" />

			<div class="order-card__content">
				<h1>Order Summary</h1>

				<p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

				<div class="plan-details">
					<div class="plan-details__info">
						<img src="./images/icon-music.svg" alt="" />

						<div class="plan-details__text">
							<p>Annual Plan</p>

							<span>$59.99/year</span>
						</div>
					</div>

					<a class="plan-details__link">Change</a>
				</div>
			</div>

			<div class="order-card__actions">
				<button class="button button--primary">Proceed to Payment</button>

				<button class="button button--ghost">Cancel Order</button>
			</div>
		</main>

		<footer>
			<p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.</p>
			<p>Coded by <a href="https://www.github.com/willalmeid">William Almeida</a>.</p>
		</footer>
	</body>
</html>
