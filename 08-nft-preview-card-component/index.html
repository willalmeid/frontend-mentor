<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
		<title>Frontend Mentor | NFT preview card component</title>

		<link rel="stylesheet" href="./styles/style.css" />
		<link rel="stylesheet" href="./styles/media-query.css" />
	</head>
	<body>
		<main>
			<div class="container-image">
				<img class="coin-image" src="./images/image-equilibrium.jpg" alt="Image of Equilibrium" />

				<div class="image-overlay" aria-hidden="true">
					<img class="icon-view" src="./images/icon-view.svg" alt="Icon of visualization" />
				</div>
			</div>

			<div class="container-information">
				<a class="container-information__title" href="#">Equilibrium #3429</a>

				<p>Our Equilibrium collection promotes balance and calm.</p>

				<div class="price-and-time">
					<span><img src="./images/icon-ethereum.svg" alt="" aria-hidden="true" /> 0.041 ETH</span>

					<p><img src="./images/icon-clock.svg" alt="" aria-hidden="true" /> 3 days left</p>
				</div>
			</div>

			<span class="line" aria-hidden="true"></span>

			<div class="creator-information">
				<img src="./images/image-avatar.png" alt="Image of Creator" />
				<span>Creation of <a href="#">Jules Wyvern</a></span>
			</div>
		</main>

		<footer>
			<p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.</p>
			<p>Coded by <a href="https://www.github.com/willalmeid">William Almeida</a>.</p>
		</footer>
	</body>
</html>
